      (function () {
        var langs = ["fr","nl","en"], chosen = null;
        try { chosen = localStorage.getItem("zero-portfolio-language"); } catch (e) {}
        if (langs.indexOf(chosen) < 0) {
          var browser = (navigator.languages && navigator.languages[0] || navigator.language || "").slice(0, 2).toLowerCase();
          chosen = langs.indexOf(browser) >= 0 ? browser : "en";
        }
        location.replace("/" + chosen + "/");
      })();
    </script>
